[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long strings in prompts and test data are fine

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "ingestion", "db", "server"]
known-third-party = ["supabase"]  # the supabase/ folder holds SQL migrations, not Python
