# Fast checks on every push and PR. No secrets and no paid API calls.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Eval harness unchanged since last approval
        run: python -m evals.run_evals --check-harness

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the agent API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: support-agent-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: support-agent-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # The API needs real keys and a database to start, so CI only checks the image has what it runs.
      - name: API image imports and includes the MCP server
        run: >-
          docker run --rm support-agent-api:ci python -c
          "import agent.api, pathlib; assert pathlib.Path(agent.api.MCP_SERVER).is_file(); print('ok')"
      - name: Web image serves pages behind the password
        run: |
          docker run -d --name web -p 3000:3000 -e DEMO_PASSWORD=ci support-agent-web:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3000/login && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = 307
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/customers)" = 401
      - name: Web container logs
        if: failure()
        run: docker logs web || true
