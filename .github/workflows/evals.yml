# The eval suite: real Claude calls against the demo Supabase project, billed to ANTHROPIC_API_KEY.
# Runs only when asked: "Run workflow" on the Actions tab, or the `run-evals` label on a PR
# (it re-runs on each push while the label is on). Scores are posted as a PR comment.
name: Evals

on:
  workflow_dispatch:
    inputs:
      reps:
        description: Runs per case
        default: "1"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

# Every run resets the same demo database, so only one may run at a time.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_TRACING_ENVIRONMENT: ci-evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Grader self-test
        run: python -m evals.run_evals --selftest
      - name: Run evals
        env:
          REPS: ${{ github.event.inputs.reps || '1' }}
        run: python -m evals.run_evals --reps "$REPS"
      - name: Build report
        if: always()
        run: node evals/report/build-report-lite.mjs evals/runs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            evals/runs/report.html
            evals/runs/baseline/
      - name: Comment scores on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f evals/runs/baseline/summary.md ]; then
            { cat evals/runs/baseline/summary.md; echo; echo "Full report: the \`eval-report\` artifact of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."; } > comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          fi
